name: Phase computer 896-byte scratch-trained rewrite gate

on:
  push:
    paths:
      - graphnn/half_memory.py
      - train_phase_gate.py
      - tests/test_half_memory.py
      - .github/workflows/phase_gate.yml
  pull_request:
    paths:
      - graphnn/half_memory.py
      - train_phase_gate.py
      - tests/test_half_memory.py
      - .github/workflows/phase_gate.yml

permissions:
  contents: read

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [41, 97, 127]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU and image dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow
      - name: Test half-memory byte budget and differentiable reader
        run: python -m unittest tests/test_half_memory.py -v
      - name: Train all new 896B models on the frozen 500-step A->B->A' gate
        run: python -u train_phase_gate.py --steps 500 --seeds ${{ matrix.seed }} --train-count 128 --test-count 128 --batch-size 8 --output runs/phase_gate
      - name: Upload trained checkpoints and measured receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-gate-seed-${{ matrix.seed }}
          path: runs/phase_gate/seed${{ matrix.seed }}/
          if-no-files-found: warn
