name: GraphNN tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy Pillow
      - run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python train.py --steps 2 --train-count 4 --test-count 4 --batch-size 2 --device cpu --output runs/smoke
      - run: python train_rewrite.py --steps 2 --seeds 41 --train-count 4 --test-count 4 --batch-size 2 --device cpu --output runs/rewrite_smoke
